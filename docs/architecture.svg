<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 652" width="1300" height="652" role="img" aria-labelledby="t"><title id="t">GIPHY Clone architecture</title><style>svg{--bg:#ffffff;--zone:#f5f6f8;--zoneStroke:#d5d9e0;--zoneLabel:#0a6fb8;--node:#ffffff;--nodeStroke:#c4cad3;--title:#111827;--text:#4b5563;--edge:#6b7280;--edgeText:#374151;--accent:#0a84d6;--pill:#ffffff;}@media (prefers-color-scheme: dark){svg{--bg:#0f1218;--zone:#151a23;--zoneStroke:#2a313d;--zoneLabel:#4db5ff;--node:#1b212c;--nodeStroke:#363e4c;--title:#f3f4f6;--text:#a4acb9;--edge:#8a93a2;--edgeText:#d1d5db;--accent:#4db5ff;--pill:#0f1218;}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.zone{fill:var(--zone);stroke:var(--zoneStroke);stroke-width:1;stroke-dasharray:5 4}
.zlabel{fill:var(--zoneLabel);font-size:12px;font-weight:700;letter-spacing:.08em}
.zsub{fill:var(--text);font-size:12px}
.node{fill:var(--node);stroke:var(--nodeStroke);stroke-width:1.2}
.node.key{stroke:var(--accent);stroke-width:2}
.bar{fill:var(--accent)}
.ntitle{fill:var(--title);font-size:14px;font-weight:600}
.ntext{fill:var(--text);font-size:12px}
.edge{fill:none;stroke:var(--edge);stroke-width:1.5}
.edge.alt{stroke-dasharray:6 4}
.head{fill:var(--edge)}
.pill{fill:var(--pill);stroke:var(--zoneStroke);stroke-width:1}
.elabel{fill:var(--edgeText);font-size:11.5px}
.legend{fill:var(--text);font-size:12px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1300" height="652" rx="14"/><rect class="zone" x="16" y="16" width="968" height="424" rx="12"/><text class="zlabel" x="36" y="46">BROWSER</text><text class="zsub" x="36" y="66">React 18 + Vite single-page app</text><rect class="zone" x="1016" y="16" width="268" height="424" rx="12"/><text class="zlabel" x="1036" y="46">GIPHY</text><text class="zsub" x="1036" y="66">Public API and media CDN</text><rect class="zone" x="16" y="464" width="968" height="140" rx="12"/><text class="zlabel" x="36" y="494">HOSTING</text><path class="edge" d="M278,157.5 L358,157.5" marker-end="url(#arrow)"/><path class="edge" d="M608,157.5 L688,157.5" marker-end="url(#arrow)"/><path class="edge" d="M952,157.5 L986,157.5 Q996,157.5 996,167.5 L996,347 Q996,357 1006,357 L1040,357" marker-end="url(#arrow)"/><path class="edge" d="M483,112 L483,92 Q483,82 493,82 L1140,82 Q1150,82 1150,92 L1150,112" marker-end="url(#arrow)"/><path class="edge" d="M483,320 L483,203" marker-end="url(#arrow)"/><path class="edge" d="M358,357.037 L278,357" marker-end="url(#arrow)"/><rect class="node" x="48" y="112" width="230" height="125" rx="10"/><text class="ntitle" x="64" y="139">React Router</text><text class="ntext" x="64" y="160">/ (trending)</text><text class="ntext" x="64" y="177">/:category</text><text class="ntext" x="64" y="194">/search/:query</text><text class="ntext" x="64" y="211">/:type/:slug (GIF detail)</text><text class="ntext" x="64" y="228">/favorites</text><rect class="node" x="358" y="112" width="250" height="91" rx="10"/><text class="ntitle" x="374" y="139">Pages</text><text class="ntext" x="374" y="160">Home, Category, Search,</text><text class="ntext" x="374" y="177">GIF detail, Favorites</text><text class="ntext" x="374" y="194">Shared loading and error UI</text><rect class="node key" x="688" y="112" width="264" height="91" rx="10"/><text class="ntitle" x="704" y="139">useGiphy hook</text><text class="ntext" x="704" y="160">Keyed by every input</text><text class="ntext" x="704" y="177">Ignores superseded responses</text><text class="ntext" x="704" y="194">Retry waits out 6 s SDK cache</text><rect class="node" x="358" y="320" width="250" height="91" rx="10"/><text class="ntitle" x="374" y="347">GifProvider context</text><text class="ntext" x="374" y="368">One GiphyFetch client</text><text class="ntext" x="374" y="385">Content-type filter</text><text class="ntext" x="374" y="402">Favorite GIF IDs</text><rect class="node" x="48" y="320" width="230" height="74" rx="10"/><rect class="bar" x="48" y="332" width="3" height="50" rx="1.5"/><text class="ntitle" x="64" y="347">localStorage</text><text class="ntext" x="64" y="368">Favorite IDs only, so</text><text class="ntext" x="64" y="385">saved GIFs never go stale</text><rect class="node" x="1040" y="112" width="220" height="74" rx="10"/><text class="ntitle" x="1056" y="139">media.giphy.com</text><text class="ntext" x="1056" y="160">GIF and sticker files</text><text class="ntext" x="1056" y="177">loaded by &lt;img&gt; tags</text><rect class="node" x="1040" y="320" width="220" height="74" rx="10"/><text class="ntitle" x="1056" y="347">GIPHY API</text><text class="ntext" x="1056" y="368">trending, search, gifs,</text><text class="ntext" x="1056" y="385">gif, related</text><rect class="node" x="358" y="492" width="320" height="91" rx="10"/><text class="ntitle" x="374" y="519">Vercel</text><text class="ntext" x="374" y="540">Serves the static build</text><text class="ntext" x="374" y="557">Rewrites every path to index.html</text><text class="ntext" x="374" y="574">so shared deep links load</text><rect class="pill" x="289.46" y="147.5" width="57.080000000000005" height="20" rx="5"/><text class="elabel" x="318" y="161.5" text-anchor="middle">renders</text><rect class="pill" x="619.46" y="140.5" width="57.080000000000005" height="34" rx="5"/><text class="elabel" x="648" y="154.5" text-anchor="middle">request</text><text class="elabel" x="648" y="168.5" text-anchor="middle">key</text><rect class="pill" x="951.36" y="240.25" width="89.28" height="34" rx="5"/><text class="elabel" x="996" y="254.25" text-anchor="middle">via</text><text class="elabel" x="996" y="268.25" text-anchor="middle">js-fetch-api</text><rect class="pill" x="781.52" y="72" width="69.96000000000001" height="20" rx="5"/><text class="elabel" x="816.5" y="86" text-anchor="middle">&lt;img src&gt;</text><rect class="pill" x="441.58" y="244.5" width="82.84" height="34" rx="5"/><text class="elabel" x="483" y="258.5" text-anchor="middle">gf, filter,</text><text class="elabel" x="483" y="272.5" text-anchor="middle">favorites</text><rect class="pill" x="286.24" y="347.0185" width="63.52" height="20" rx="5"/><text class="elabel" x="318" y="361.0185" text-anchor="middle">persists</text><path class="edge" d="M36,626 L70,626" marker-end="url(#arrow)"/><text class="legend" x="80" y="630">Call or request (responses return the same way)</text><rect class="node key" x="425.84000000000003" y="618" width="22" height="16" rx="4"/><text class="legend" x="455.84000000000003" y="630">Core logic</text><rect class="node" x="553.0400000000001" y="618" width="22" height="16" rx="4"/><rect class="bar" x="553.0400000000001" y="621" width="3" height="10" rx="1.5"/><text class="legend" x="583.0400000000001" y="630">Persisted state</text></svg>
